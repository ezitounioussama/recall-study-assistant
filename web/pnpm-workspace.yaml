# pnpm 10+ reads install settings from here, not from package.json.
# unrs-resolver's postinstall builds an optional native binary; pnpm 11 fails
# an install over an unapproved build script. `allowBuilds` is the pnpm 11
# key (`pnpm approve-builds --all` wrote it); the older onlyBuiltDependencies
# and ignoredBuiltDependencies keys are read but no longer silence the error.
packages:
  - .
allowBuilds:
  unrs-resolver: true
